#
# boot.conf(8): the second stage bootstrap reads /etc/boot.conf before it
# loads the kernel; the file may hold any command the bootstrap accepts at
# its prompt. "stty com0 115200" sets the speed of the serial console and
# "set tty com0" makes that console the system console, so the headless
# appliance is reachable over the serial line.

stty com0 115200
set tty com0
