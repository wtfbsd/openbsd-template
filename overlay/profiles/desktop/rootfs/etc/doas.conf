# doas.conf(5) — desktop profile (the operator becomes root).
#
# Copyright (c) 2026 The wtfbsd contributors. BSD-2-Clause (see LICENSE).
#
# doas.conf(5): the file holds the rules of doas(1), one rule per line.
# The group wheel is the group of the accounts that may become root, and
# the operator account the installer creates is a member of it: install.site
# adds the account to the group with usermod(8), because autoinstall(8)
# does not ask for the groups of the account it creates.
#
# The desktop is a console system: it has no sshd, and the operator logs
# in at the console with the password the build was given (-P HASHFILE).
# The rule therefore asks for that password, and "persist" keeps the
# credentials for a while, so the operator is asked once and not on every
# command.
#
# The file is read by root and by nobody else: the build gives it the mode
# 0600.

permit persist :wheel
