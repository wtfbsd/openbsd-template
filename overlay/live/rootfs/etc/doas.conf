# doas.conf(5) — the live image.
#
# Copyright (c) 2026 The wtfbsd contributors. BSD-2-Clause (see LICENSE).
#
# Live image only (the live set). The installed system has the doas.conf of
# the desktop profile: the members of wheel become root with their password.
#
# The live user has no password and is not in wheel. The installer's front
# ends (graphical and text) run as the live user, never as root: a GTK
# program run as root on the user's display loads code the user controls.
# The one thing the live user may run as root is the installer's GTK-free
# helper, with no environment of the user (no keepenv, no setenv).

permit nopass live as root cmd /usr/local/libexec/wtfbsd-installer/installer-apply
